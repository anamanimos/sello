<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atur Ulang Password — Sello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <link rel="icon" href="/static/images/sello-icon.ico" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="/" class="logo">
            <img src="/static/images/sello-logo.webp" alt="Sello" height="40" />
          </a>
          <h1>Password Baru</h1>
          <p>Masukkan password baru yang aman untuk akun Anda</p>
        </div>

        <!-- Reset Form -->
        <form id="resetForm" class="auth-form">
          <input type="hidden" id="token" name="token" />

          <div class="form-group">
            <label for="password">Password Baru</label>
            <div class="password-input">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimal 8 karakter"
                required
                minlength="8"
              />
              <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('password')"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Konfirmasi Password</label>
            <div class="password-input">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Ulangi password baru"
                required
                minlength="8"
              />
              <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('confirmPassword')"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            <span class="btn-text">Simpan Password</span>
            <span class="btn-loader" style="display: none">
              <svg class="spinner" width="20" height="20" viewBox="0 0 24 24">
                <circle
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="3"
                  fill="none"
                  stroke-dasharray="60"
                  stroke-linecap="round"
                />
              </svg>
            </span>
          </button>
        </form>

        <!-- Success Message -->
        <div id="successMessage" class="auth-form" style="display: none">
          <div
            class="success-icon"
            style="text-align: center; margin-bottom: 1.5rem"
          >
            <svg
              width="64"
              height="64"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#10b981"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M8 12l2 2 4-4" />
            </svg>
          </div>
          <p
            style="
              text-align: center;
              color: var(--text-secondary);
              margin-bottom: 1.5rem;
            "
          >
            Password Anda telah berhasil diperbarui. Silakan login dengan
            password baru.
          </p>
          <a href="/login" class="btn btn-primary btn-block btn-lg">
            Masuk Sekarang
          </a>
        </div>
      </div>

      <div class="auth-visual">
        <div class="visual-content">
          <h2>Tips Keamanan</h2>
          <div class="visual-features">
            <div class="visual-feature">
              <span class="feature-icon">✓</span>
              <span>Gunakan kombinasi huruf, angka, simbol</span>
            </div>
            <div class="visual-feature">
              <span class="feature-icon">✓</span>
              <span>Jangan gunakan ulang password lama</span>
            </div>
            <div class="visual-feature">
              <span class="feature-icon">✓</span>
              <span>Aktifkan notifikasi login</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
      // Get token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      if (token) {
        document.getElementById("token").value = token;
      } else {
        alert("Link tidak valid. Silakan request reset password ulang.");
        window.location.href = "/forgot-password";
      }

      function togglePassword(id) {
        const input = document.getElementById(id);
        if (input.type === "password") {
          input.type = "text";
        } else {
          input.type = "password";
        }
      }

      document
        .getElementById("resetForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const password = document.getElementById("password").value;
          const confirm = document.getElementById("confirmPassword").value;
          const tokenVal = document.getElementById("token").value;

          if (password !== confirm) {
            alert("Password tidak cocok");
            return;
          }

          const btn = this.querySelector('button[type="submit"]');
          const btnText = btn.querySelector(".btn-text");
          const btnLoader = btn.querySelector(".btn-loader");

          // Show loading
          btnText.style.display = "none";
          btnLoader.style.display = "inline-block";
          btn.disabled = true;

          try {
            const response = await fetch("/api/auth/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                token: tokenVal,
                new_password: password,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              // Show success message
              document.getElementById("resetForm").style.display = "none";
              document.getElementById("successMessage").style.display = "block";
            } else {
              alert(data.error || "Gagal reset password");
            }
          } catch (err) {
            alert("Terjadi kesalahan. Silakan coba lagi.");
          } finally {
            btnText.style.display = "inline";
            btnLoader.style.display = "none";
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
