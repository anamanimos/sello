<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }} — Sello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body class="dashboard-page">
    <div id="sidebar"></div>

    <main class="main-content">
      <header class="dashboard-header">
        <div class="header-left">
          <h1>Kategori</h1>
          <p>Kelola kategori produk toko Anda</p>
        </div>
        <div class="header-right">
          <button class="btn btn-primary" onclick="openCreateModal()">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Tambah Kategori
          </button>
        </div>
      </header>

      <!-- Toolbar -->
      <div class="products-toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="Cari kategori..."
              oninput="handleSearch(this.value)"
            />
          </div>
        </div>
      </div>

      <div class="products-list" id="categoriesList" style="margin-top: 20px">
        <div class="empty-state">
          <p>Memuat...</p>
        </div>
      </div>

      <style>
        .products-toolbar {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
          padding: 16px;
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          border-radius: var(--radius);
        }
        .toolbar-left {
          display: flex;
          gap: 12px;
          flex: 1;
          min-width: 280px;
        }
        .search-box {
          flex: 1;
          position: relative;
          display: flex;
          align-items: center;
        }
        .search-box svg {
          position: absolute;
          left: 10px;
          color: var(--text-muted);
        }
        .search-box input {
          width: 100%;
          padding: 8px 10px 8px 36px;
          border: 1px solid var(--border-color);
          border-radius: 6px;
          background: var(--bg-primary);
          color: var(--text-primary);
        }
        .text-right {
          text-align: right;
        }
      </style>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="categoryModal">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle">Tambah Kategori</h2>
        </div>
        <form id="categoryForm">
          <input type="hidden" id="categoryId" />
          <div class="form-group">
            <label>Nama Kategori</label>
            <input
              type="text"
              id="categoryName"
              name="name"
              placeholder="Contoh: Elektronik"
              required
            />
          </div>
          <div class="modal-actions">
            <button
              type="button"
              class="btn btn-outline"
              onclick="closeModal()"
            >
              Batal
            </button>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/static/js/admin-layout.js?v=2"></script>
    <script src="/static/js/categories.js"></script>
  </body>
</html>
