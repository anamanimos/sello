<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Saya — Sello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .profile-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 24px;
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-bottom: 32px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border-light);
      }

      .profile-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: var(--bg-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
        color: var(--text-secondary);
        border: 4px solid var(--bg-primary);
        box-shadow: var(--shadow-md);
      }

      .section-card {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
      }

      .section-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 16px;
        color: var(--text-primary);
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--text-secondary);
        font-size: 14px;
      }

      .form-control {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.2s;
        background: var(--bg-primary);
        color: var(--text-primary);
      }

      .form-control:focus {
        outline: none;
        border-color: var(--accent);
      }

      .form-control:disabled {
        background: var(--bg-secondary);
        cursor: not-allowed;
        opacity: 0.7;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
        margin-top: 8px;
      }

      .btn-primary:hover {
        opacity: 0.9;
      }

      .google-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #e8f0fe;
        color: #1a73e8;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
        margin-left: 8px;
      }
    </style>
  </head>
  <body class="dashboard-page">
    <div id="sidebar"></div>

    <main class="main-content">
      <div class="profile-container">
        <h1>Pengaturan Akun</h1>
        <p style="color: var(--text-secondary); margin-bottom: 24px">
          Kelola informasi profil dan keamanan akun Anda.
        </p>

        <div class="profile-header">
          <div class="profile-avatar" id="avatarInitials">--</div>
          <div>
            <h2 id="displayName" style="margin-bottom: 4px">Loading...</h2>
            <div
              style="color: var(--text-secondary); font-size: 14px"
              id="displayEmail"
            >
              loading@sello.id
            </div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-title">Informasi Dasar</div>
          <form id="profileForm" onsubmit="handleProfileUpdate(event)">
            <div class="form-group">
              <label class="form-label">Nama Lengkap</label>
              <input type="text" id="nameInput" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label">
                Email
                <span
                  id="googleBadge"
                  class="google-badge"
                  style="display: none"
                >
                  <svg
                    width="12"
                    height="12"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                      fill="#4285F4"
                    />
                    <path
                      d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                      fill="#34A853"
                    />
                    <path
                      d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                      fill="#FBBC05"
                    />
                    <path
                      d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                      fill="#EA4335"
                    />
                  </svg>
                  Google Linked
                </span>
              </label>
              <input
                type="email"
                id="emailInput"
                class="form-control"
                disabled
              />
              <small
                style="
                  color: var(--text-muted);
                  font-size: 12px;
                  margin-top: 4px;
                  display: block;
                "
                >Email tidak dapat diubah (terhubung dengan akun Google).</small
              >
            </div>

            <div class="form-group">
              <label class="form-label">Nomor WhatsApp</label>
              <input
                type="text"
                id="whatsappInput"
                class="form-control"
                placeholder="Contoh: 628123456789"
              />
              <small style="color: var(--text-muted); font-size: 12px"
                >Gunakan format 62 diawal (tanpa 0).</small
              >
            </div>

            <button type="submit" class="btn btn-primary">
              Simpan Perubahan
            </button>
          </form>
        </div>

        <div class="section-card">
          <div class="section-title">Keamanan</div>
          <form id="passwordForm" onsubmit="handlePasswordUpdate(event)">
            <div class="form-group" id="oldPasswordGroup">
              <label class="form-label">Kata Sandi Lama</label>
              <input type="password" id="oldPassword" class="form-control" />
            </div>

            <div class="form-group">
              <label class="form-label" id="newPasswordLabel"
                >Kata Sandi Baru</label
              >
              <input
                type="password"
                id="newPassword"
                class="form-control"
                required
                minlength="8"
              />
            </div>

            <div class="form-group">
              <label class="form-label">Konfirmasi Kata Sandi Baru</label>
              <input
                type="password"
                id="confirmPassword"
                class="form-control"
                required
                minlength="8"
              />
            </div>

            <button
              type="submit"
              class="btn btn-primary"
              style="background: var(--text-primary)"
            >
              Update Password
            </button>
          </form>
        </div>
      </div>
    </main>

    <script src="/static/js/admin-layout.js?v=2"></script>
    <script>
      let isGoogleUser = false;

      document.addEventListener("DOMContentLoaded", async () => {
        lucide.createIcons();
        await loadProfile();
      });

      async function loadProfile() {
        try {
          const res = await apiRequest("/api/auth/me");
          const user = res.user;

          // Update Header
          document.getElementById("displayName").textContent = user.name;
          document.getElementById("displayEmail").textContent = user.email;
          document.getElementById("avatarInitials").textContent = user.name
            .substring(0, 2)
            .toUpperCase();

          // Populate Form
          document.getElementById("nameInput").value = user.name;
          document.getElementById("emailInput").value = user.email;
          document.getElementById("whatsappInput").value = user.whatsapp;

          // Detect if Google User (Empty Password implies OAuth flow usually, or we verify via explicit flag if added)
          // But relying on password hash being empty locally if using pure OAuth.
          // Better: Backend should tell us "has_password".
          // Since we can't see password hash in GetMe, we need backend to send a flag.

          if (res.is_google_user) {
            isGoogleUser = true;
            document.getElementById("googleBadge").style.display =
              "inline-flex";
            document.getElementById("oldPasswordGroup").style.display = "none";
            document.getElementById("newPasswordLabel").textContent =
              "Buat Kata Sandi (Opsional)";
          } else {
            document.getElementById("emailInput").disabled = true; // Still disabled for everyone per requirements for now?
            // Wait, user said "login with Google implies email cannot change".
            // If normal login, maybe they CAN change? Let's keep it disabled for MVP safety or consistency.
            // "tolong pertimbangkan login with google. artinya email tidak bisa diganti"
          }
        } catch (e) {
          console.error("Load failed", e);
        }
      }

      async function handleProfileUpdate(e) {
        e.preventDefault();

        const name = document.getElementById("nameInput").value;
        const whatsapp = document.getElementById("whatsappInput").value;

        try {
          await apiRequest("/api/auth/profile", {
            method: "PUT",
            body: JSON.stringify({
              name,
              whatsapp,
            }),
          });
          showToast("Profil berhasil diperbarui", "success");
          loadProfile(); // Refresh
        } catch (e) {
          showToast("Gagal update profil", "error");
        }
      }

      async function handlePasswordUpdate(e) {
        e.preventDefault();

        const old_password = document.getElementById("oldPassword").value;
        const new_password = document.getElementById("newPassword").value;
        const confirm_password =
          document.getElementById("confirmPassword").value;

        if (new_password !== confirm_password) {
          showToast("Konfirmasi password tidak cocok", "error");
          return;
        }

        try {
          const payload = { new_password };
          if (!isGoogleUser) {
            payload.old_password = old_password;
          }

          await apiRequest("/api/auth/password", {
            method: "PUT",
            body: JSON.stringify(payload),
          });

          showToast("Password berhasil diupdate", "success");
          e.target.reset();
        } catch (e) {
          // Error usually contains message
          showToast(
            e.message || "Gagal update password. Periksa password lama.",
            "error",
          );
        }
      }
    </script>
  </body>
</html>
