<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Paket — Sello Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- DataTables CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css"
    />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <link rel="icon" href="/static/images/sello-icon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <style>
      /* Offcanvas Sidebar Styles */
      .offcanvas-backdrop {
        display: none;
        position: fixed;
        z-index: 999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(2px);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .offcanvas-backdrop.show {
        display: block;
        opacity: 1;
      }

      .offcanvas {
        position: fixed;
        z-index: 1000;
        top: 0;
        right: -500px; /* Start off-screen */
        width: 450px;
        height: 100vh;
        background-color: white;
        box-shadow: -5px 0 25px rgba(0, 0, 0, 0.1);
        transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        max-width: 100%;
      }
      .offcanvas.show {
        right: 0;
      }

      .offcanvas-header {
        padding: 24px;
        border-bottom: 1px solid var(--border-light);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fff;
      }
      .offcanvas-header h2 {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0;
      }
      .offcanvas-close {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: var(--text-secondary);
        padding: 4px;
        line-height: 1;
        border-radius: 4px;
        transition: background 0.2s;
      }
      .offcanvas-close:hover {
        background: var(--bg-secondary);
        color: var(--text-primary);
      }

      .offcanvas-body {
        padding: 24px;
        overflow-y: auto;
        flex: 1;
      }

      .offcanvas-footer {
        padding: 20px 24px;
        background: #f9fafb;
        border-top: 1px solid var(--border-light);
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }

      /* Form Grid */
      .form-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .input-wrapper {
        position: relative;
      }
      .input-group {
        display: flex;
        gap: 12px;
      }
      .input-group .form-group {
        flex: 1;
      }

      .form-group {
        margin-bottom: 0;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        font-size: 14px;
        color: var(--text-primary);
      }
      .form-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
        font-size: 14px;
        transition: all 0.2s;
      }
      .form-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }
      .form-hint {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
      }

      /* Checkbox Groups - Enhanced */
      .features-section {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
      }
      .feature-item {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        cursor: pointer;
        padding: 8px;
        border-radius: 6px;
        transition: background 0.2s;
      }
      .feature-item:hover {
        background: #edf2f7;
      }
      .feature-item:last-child {
        margin-bottom: 0;
      }
      .feature-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--primary);
        margin-right: 12px;
      }
      .feature-text {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-primary);
      }
      .feature-desc {
        display: block;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 400;
      }

      /* DataTables Customization */
      .dataTables_wrapper .dataTables_length,
      .dataTables_wrapper .dataTables_filter {
        margin-bottom: 20px;
      }
      .dataTables_wrapper .dataTables_length select,
      .dataTables_wrapper .dataTables_filter input {
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 6px 10px;
        font-family: inherit;
        font-size: 14px;
        margin-left: 8px;
      }
      .dataTables_wrapper .dataTables_filter input:focus,
      .dataTables_wrapper .dataTables_length select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
      }
      table.dataTable thead th {
        background-color: #f8fafc;
        border-bottom: 1px solid #e2e8f0 !important;
        color: #64748b;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 16px 24px !important;
      }
      table.dataTable tbody td {
        padding: 16px 24px !important;
        border-bottom: 1px solid #f1f5f9 !important;
        color: #334155;
        font-size: 14px;
        vertical-align: middle;
      }
      table.dataTable.no-footer {
        border-bottom: 1px solid #e2e8f0 !important;
      }

      .badge {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3px;
        display: inline-flex;
        align-items: center;
      }
      .badge-blue {
        background: #eff6ff;
        color: #3b82f6;
        border: 1px solid #dbeafe;
      }
      .badge-purple {
        background: #f3e8ff;
        color: #9333ea;
        border: 1px solid #e9d5ff;
      }
      .badge-gray {
        background: #f3f4f6;
        color: #6b7280;
      }
    </style>
  </head>
  <body class="dashboard-page">
    <div id="sidebar"></div>

    <main class="main-content">
      <div
        class="header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 32px;
        "
      >
        <div>
          <h1
            style="
              font-size: 24px;
              font-weight: 700;
              color: var(--text-primary);
              margin-bottom: 4px;
            "
          >
            Kelola Paket Langganan
          </h1>
          <p style="color: var(--text-secondary)">
            Atur skema harga dan fitur untuk merchant.
          </p>
        </div>
        <button
          onclick="openCreateOffcanvas()"
          class="btn btn-primary"
          style="
            padding: 10px 20px;
            font-weight: 500;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
          "
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            style="margin-right: 8px; vertical-align: text-bottom"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Buat Paket Baru
        </button>
      </div>

      <div
        class="panel"
        style="
          background: white;
          border-radius: 16px;
          border: 1px solid var(--border-color);
          padding: 24px;
          box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        "
      >
        <table id="plansTable" class="table" style="width: 100%">
          <thead>
            <tr>
              <th width="20%">Nama Paket</th>
              <th width="20%">Biaya Langganan</th>
              <th width="30%">Batasan (Limit)</th>
              <th width="20%">Fitur Unggulan</th>
              <th width="10%">Aksi</th>
            </tr>
          </thead>
          <tbody id="plansTableBody">
            <!-- DataTables will populate this -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- Offcanvas Backdrop -->
    <div
      id="offcanvasBackdrop"
      class="offcanvas-backdrop"
      onclick="closeOffcanvas()"
    ></div>

    <!-- Offcanvas Form (Sidebar) -->
    <div id="planOffcanvas" class="offcanvas">
      <form
        id="planForm"
        onsubmit="handleSave(event)"
        style="display: flex; flex-direction: column; height: 100%"
      >
        <div class="offcanvas-header">
          <h2 id="offcanvasTitle">Buat Paket Baru</h2>
          <button
            type="button"
            class="offcanvas-close"
            onclick="closeOffcanvas()"
          >
            ×
          </button>
        </div>

        <div class="offcanvas-body">
          <input type="hidden" name="id" />
          <div class="form-grid">
            <div class="form-group">
              <label>Nama Paket</label>
              <input
                type="text"
                name="name"
                class="form-input"
                required
                placeholder="Contoh: Basic, Pro, Business"
              />
              <div class="form-hint">
                Nama yang akan tampil di halaman pricing.
              </div>
            </div>

            <div class="input-group">
              <div class="form-group">
                <label>Harga Bulanan (Rp)</label>
                <input
                  type="number"
                  name="price_monthly"
                  class="form-input"
                  required
                  placeholder="0"
                />
              </div>
              <div class="form-group">
                <label>Harga Tahunan (Rp)</label>
                <input
                  type="number"
                  name="price_yearly"
                  class="form-input"
                  required
                  placeholder="0"
                />
              </div>
            </div>

            <div class="input-group">
              <div class="form-group">
                <label>Max Toko</label>
                <input
                  type="number"
                  name="max_stores"
                  class="form-input"
                  value="1"
                />
              </div>
              <div class="form-group">
                <label>Max Produk/Toko</label>
                <input
                  type="number"
                  name="max_products_per_store"
                  class="form-input"
                  value="10"
                />
              </div>
            </div>

            <div class="form-group">
              <label>Max Storage (MB)</label>
              <input
                type="number"
                name="max_storage_mb"
                class="form-input"
                value="100"
              />
              <div class="form-hint">Kapasitas penyimpanan gambar produk.</div>
            </div>

            <div
              class="form-group"
              style="
                padding: 12px;
                background: #f0fdf4;
                border: 1px solid #bbf7d0;
                border-radius: 8px;
              "
            >
              <label
                style="
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  margin-bottom: 0;
                  cursor: pointer;
                "
              >
                <div>
                  <span style="font-weight: 600; color: #15803d; display: block"
                    >Status Paket: Aktif</span
                  >
                  <span
                    style="font-size: 12px; color: #166534; font-weight: 400"
                    >Tampilkan paket ini untuk dibeli user baru?</span
                  >
                </div>
                <div class="toggle-switch">
                  <input
                    type="checkbox"
                    name="is_active"
                    style="display: none"
                  />
                  <div
                    class="switch-slider"
                    style="
                      width: 40px;
                      height: 24px;
                      background: #ddd;
                      border-radius: 12px;
                      position: relative;
                      transition: 0.2s;
                    "
                  >
                    <div
                      class="switch-knob"
                      style="
                        width: 18px;
                        height: 18px;
                        background: white;
                        border-radius: 50%;
                        position: absolute;
                        top: 3px;
                        left: 3px;
                        transition: 0.2s;
                      "
                    ></div>
                  </div>
                </div>
              </label>
            </div>

            <style>
              input[name="is_active"]:checked + .switch-slider {
                background: #22c55e;
              }
              input[name="is_active"]:checked + .switch-slider .switch-knob {
                transform: translateX(16px);
              }
            </style>

            <div class="form-group">
              <label style="margin-bottom: 12px; display: block"
                >Fitur & Akses</label
              >
              <div class="features-section">
                <label class="feature-item">
                  <input type="checkbox" name="allow_custom_domain" />
                  <div>
                    <div class="feature-text">Custom Domain</div>
                    <span class="feature-desc"
                      >Merchant bisa pakai domain sendiri (.com)</span
                    >
                  </div>
                </label>

                <label class="feature-item">
                  <input type="checkbox" name="remove_branding" />
                  <div>
                    <div class="feature-text">Hapus Branding</div>
                    <span class="feature-desc"
                      >Hilangkan logo "Powered by Sello"</span
                    >
                  </div>
                </label>

                <label class="feature-item">
                  <input type="checkbox" name="access_premium_themes" />
                  <div>
                    <div class="feature-text">Tema Premium</div>
                    <span class="feature-desc"
                      >Akses ke template desain eksklusif</span
                    >
                  </div>
                </label>

                <label class="feature-item">
                  <input type="checkbox" name="allow_external_link" />
                  <div>
                    <div class="feature-text">External Link Produk</div>
                    <span class="feature-desc"
                      >Produk bisa diarahkan ke link eksternal (Shopee,
                      Tokopedia, dll)</span
                    >
                  </div>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="offcanvas-footer">
          <button
            type="button"
            onclick="closeOffcanvas()"
            class="btn btn-outline"
            style="border-color: #e2e8f0; color: #475569"
          >
            Batal
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            style="padding-left: 24px; padding-right: 24px"
          >
            Simpan Paket
          </button>
        </div>
      </form>
    </div>

    <script src="/static/js/console-layout.js"></script>
    <script>
      let table; // DataTables instance
      const token = localStorage.getItem("admin_token");
      if (!token) window.location.href = "/console/login";

      async function apiRequest(url, options = {}) {
        const res = await fetch(url, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
            ...options.headers,
          },
        });
        if (res.status === 401) {
          window.location.href = "/console/login";
          return;
        }
        return res;
      }

      $(document).ready(function () {
        loadPlans();
      });

      async function loadPlans() {
        try {
          const res = await apiRequest("/console/api/plans");
          if (res.ok) {
            const plans = await res.json();
            renderTable(plans);
          } else {
            const err = await res.json();
            Swal.fire(
              "Error",
              "Gagal memuat data: " + (err.error || "Unknown"),
              "error",
            );
          }
        } catch (e) {
          console.error(e);
          Swal.fire("Error", "Server error", "error");
        }
      }

      function renderTable(data) {
        if ($.fn.DataTable.isDataTable("#plansTable")) {
          $("#plansTable").DataTable().destroy();
        }

        const tbody = document.getElementById("plansTableBody");
        if (data.length === 0) {
          tbody.innerHTML = "";
        } else {
          tbody.innerHTML = data
            .map(
              (p) => `
                <tr>
                    <td>
                        <div style="font-weight: 600; font-size: 15px; color: #1e293b;">${p.name}</div>
                    </td>
                    <td>
                        <div style="font-weight: 500; color: #0f172a;">Rp ${p.price_monthly.toLocaleString()}<span style="font-size:12px; color:var(--text-secondary); font-weight:400;"> /bln</span></div>
                        <div style="font-size:12px; color:var(--text-secondary);">Rp ${p.price_yearly.toLocaleString()} /thn</div>
                    </td>
                    <td>
                        <div style="font-size: 13px; line-height: 1.6; color: #475569;">
                            <div style="display:flex; align-items:center; gap:6px;">🏪 <strong style="color:#0f172a;">${p.max_stores}</strong> Toko</div>
                            <div style="display:flex; align-items:center; gap:6px;">📦 <strong style="color:#0f172a;">${p.max_products_per_store}</strong> Prd/Toko</div>
                            <div style="display:flex; align-items:center; gap:6px;">☁️ <strong style="color:#0f172a;">${p.max_storage_mb}</strong> MB</div>
                        </div>
                    </td>
                    <td>
                        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                            ${p.is_active ? '<span class="badge" style="background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0;">Active</span>' : '<span class="badge badge-gray">Archived</span>'}
                            ${p.allow_custom_domain ? '<span class="badge badge-blue">Domain</span>' : ""}
                            ${p.access_premium_themes ? '<span class="badge badge-purple">Themes</span>' : ""}
                            ${p.allow_external_link ? '<span class="badge" style="background:#fef3c7; color:#d97706; border:1px solid #fde68a;">ExtLink</span>' : ""}
                            ${!p.allow_custom_domain && !p.access_premium_themes && !p.allow_external_link ? '<span class="badge badge-gray" style="opacity:0.5">-</span>' : ""}
                        </div>
                    </td>
                    <td>
                        <div style="display: flex; gap: 8px;">
                            <button onclick='editPlan(${JSON.stringify(p).replace(/'/g, "&#39;")})' 
                                    class="btn btn-outline btn-sm" 
                                    style="padding: 8px; border-color: #cbd5e1; color: #475569;"
                                    title="Edit">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                            </button>
                            <button onclick="deletePlan(${p.id})" 
                                    class="btn btn-sm" 
                                    style="background: #fef2f2; color: #dc2626; padding: 8px; border: 1px solid #fee2e2;"
                                    title="Hapus">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `,
            )
            .join("");
        }

        // Initialize DataTable with enhanced styling
        table = $("#plansTable").DataTable({
          responsive: true,
          pageLength: 10,
          lengthMenu: [5, 10, 25, 50],
          language: {
            search: "_INPUT_",
            searchPlaceholder: "Cari paket...",
            lengthMenu: "Tampil _MENU_",
            info: "Menampilkan _START_-_END_ dari _TOTAL_",
            paginate: {
              first: "«",
              last: "»",
              next: "›",
              previous: "‹",
            },
            emptyTable: "Belum ada data paket",
          },
          columnDefs: [{ orderable: false, targets: 4 }],
          dom: '<"d-flex justify-content-between align-items-center mb-4"lf>rt<"d-flex justify-content-between align-items-center mt-4"ip>',
        });
      }

      function openCreateOffcanvas() {
        document.getElementById("planForm").reset();
        document.querySelector("[name=id]").value = "";
        document.getElementById("offcanvasTitle").textContent =
          "Buat Paket Baru";

        document.getElementById("offcanvasBackdrop").classList.add("show");
        document.getElementById("planOffcanvas").classList.add("show");
      }

      function closeOffcanvas() {
        document.getElementById("offcanvasBackdrop").classList.remove("show");
        document.getElementById("planOffcanvas").classList.remove("show");
      }

      function editPlan(plan) {
        const form = document.getElementById("planForm");
        form.id.value = plan.id;
        form.name.value = plan.name;
        form.price_monthly.value = plan.price_monthly;
        form.price_yearly.value = plan.price_yearly;
        form.max_stores.value = plan.max_stores;
        form.max_products_per_store.value = plan.max_products_per_store;
        form.max_storage_mb.value = plan.max_storage_mb;

        form.allow_custom_domain.checked = plan.allow_custom_domain;
        form.allow_external_link.checked = plan.allow_external_link;
        form.remove_branding.checked = plan.remove_branding;
        form.access_premium_themes.checked = plan.access_premium_themes;

        document.getElementById("offcanvasTitle").textContent = "Edit Paket";

        document.getElementById("offcanvasBackdrop").classList.add("show");
        document.getElementById("planOffcanvas").classList.add("show");
      }

      async function handleSave(e) {
        e.preventDefault();
        const formData = new FormData(e.target);

        const data = {
          name: formData.get("name"),
          price_monthly: parseFloat(formData.get("price_monthly")) || 0,
          price_yearly: parseFloat(formData.get("price_yearly")) || 0,
          max_stores: parseInt(formData.get("max_stores")) || 0,
          max_products_per_store:
            parseInt(formData.get("max_products_per_store")) || 0,
          max_storage_mb: parseInt(formData.get("max_storage_mb")) || 0,
          allow_custom_domain: formData.get("allow_custom_domain") === "on",
          allow_custom_slug: true,
          is_active: formData.get("is_active") === "on",
          remove_branding: formData.get("remove_branding") === "on",
          access_premium_themes: formData.get("access_premium_themes") === "on",
          allow_external_link: formData.get("allow_external_link") === "on",
        };

        const id = formData.get("id");
        const method = id ? "PUT" : "POST";
        const url = id ? `/console/api/plans/${id}` : "/console/api/plans";

        try {
          const res = await apiRequest(url, {
            method: method,
            body: JSON.stringify(data),
          });

          if (res.ok) {
            closeOffcanvas();
            loadPlans();
            Swal.fire({
              title: "Berhasil",
              text: "Paket berhasil disimpan",
              icon: "success",
              timer: 1500,
              showConfirmButton: false,
              toast: true,
              position: "top-end",
            });
          } else {
            const err = await res.json();
            Swal.fire("Gagal", err.error || "Gagal menyimpan paket", "error");
          }
        } catch (err) {
          Swal.fire("Error", err.message, "error");
        }
      }

      async function deletePlan(id) {
        const result = await Swal.fire({
          title: "Hapus Paket?",
          text: "Paket yang dihapus tidak dapat dikembalikan!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#dc2626",
          cancelButtonColor: "#6b7280",
          confirmButtonText: "Ya, Hapus!",
          cancelButtonText: "Batal",
        });

        if (result.isConfirmed) {
          try {
            const res = await apiRequest(`/console/api/plans/${id}`, {
              method: "DELETE",
            });
            if (res.ok) {
              loadPlans();
              Swal.fire({
                title: "Terhapus",
                text: "Paket telah dihapus.",
                icon: "success",
                timer: 1500,
                showConfirmButton: false,
                toast: true,
                position: "top-end",
              });
            } else {
              Swal.fire("Gagal", "Tidak dapat menghapus paket.", "error");
            }
          } catch (e) {
            Swal.fire("Error", "Server error", "error");
          }
        }
      }
    </script>
  </body>
</html>
