<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kustomisasi Tema — Sello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --sidebar-width: 300px;
        --header-height: 48px;
        --primary: #3b82f6;
        --border-color: #e5e7eb;
        --bg-gray: #f3f4f6;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
      }

      /* SIDEBAR */
      .customizer-sidebar {
        width: var(--sidebar-width);
        background: white;
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        height: 100%;
        flex-shrink: 0;
        z-index: 20;
      }

      .sidebar-header {
        padding: 16px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .btn-close {
        cursor: pointer;
        color: #6b7280;
        transition: color 0.2s;
      }
      .btn-close:hover {
        color: #111827;
      }

      .sidebar-title h3 {
        font-size: 14px;
        color: #6b7280;
        font-weight: 500;
      }
      .sidebar-subtitle {
        font-size: 16px;
        font-weight: 600;
        color: #111827;
        margin-top: 2px;
      }

      .sidebar-content {
        flex: 1;
        overflow-y: auto;
      }

      /* Sections like Site Identity, Colors */
      .accordion-item {
        border-bottom: 1px solid var(--border-color);
      }

      .accordion-header {
        padding: 16px;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
      }
      .accordion-header:hover {
        background: #f9fafb;
      }
      .accordion-header:after {
        content: "›";
        font-size: 18px;
        transform: rotate(90deg);
        transition: transform 0.2s;
      }
      .accordion-item.active .accordion-header:after {
        transform: rotate(270deg);
      }

      .accordion-body {
        display: none;
        padding: 16px;
        background: #f9fafb;
        border-top: 1px solid var(--border-color);
      }
      .accordion-item.active .accordion-body {
        display: block;
      }

      /* Inputs */
      .control-group {
        margin-bottom: 12px;
      }
      .control-label {
        display: block;
        font-size: 12px;
        color: #6b7280;
        margin-bottom: 6px;
      }

      .input-text {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 13px;
      }
      .input-text:focus {
        outline: 2px solid var(--primary);
        outline-offset: -1px;
      }

      .input-color-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .input-color {
        width: 36px;
        height: 36px;
        padding: 2px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        cursor: pointer;
      }

      /* Footer Controls */
      .sidebar-footer {
        padding: 16px;
        border-top: 1px solid var(--border-color);
        background: white;
      }

      .device-toggles {
        display: flex;
        gap: 16px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #f3f4f6;
        align-items: center;
      }

      .device-btn {
        background: none;
        border: none;
        color: #9ca3af;
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
      }
      .device-btn:hover,
      .device-btn.active {
        color: var(--primary);
        background: #eff6ff;
      }

      .btn-save {
        width: 100%;
        background: var(--primary);
        color: white;
        padding: 10px;
        border-radius: 6px;
        border: none;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-save:hover {
        background: #2563eb;
      }
      .btn-save:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      /* PREVIEW AREA */
      .preview-area {
        flex: 1;
        background: #f0f0f1; /* Wordpress gray style */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .preview-container {
        width: 100%;
        height: 100%;
        background: white;
        transition: width 0.3s ease;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      .preview-container.tablet {
        width: 768px;
        height: 95%;
        margin-top: 2%;
        border-radius: 8px;
      }
      .preview-container.mobile {
        width: 375px;
        height: 95%;
        margin-top: 2%;
        border-radius: 8px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* Loading Overlay */
      .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .loading-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="customizer-sidebar">
      <div class="sidebar-header">
        <div
          class="btn-close"
          onclick="window.location.href = '/dashboard/theme'"
        >
          <i data-lucide="x" width="20"></i>
        </div>
        <div class="sidebar-title">
          <div
            style="
              font-size: 11px;
              text-transform: uppercase;
              letter-spacing: 0.5px;
              color: #6b7280;
              margin-bottom: 4px;
            "
          >
            You are customizing
          </div>
          <div class="sidebar-subtitle" id="storeNameDisplay">Loading...</div>

          <div style="margin-top: 12px">
            <select
              id="pageSelector"
              onchange="switchPage(this.value)"
              style="
                width: 100%;
                padding: 6px;
                border: 1px solid #d1d5db;
                border-radius: 4px;
                font-size: 12px;
                cursor: pointer;
              "
            >
              <option value="index">Halaman: Beranda</option>
              <option value="product">Halaman: Detail Produk</option>
            </select>
          </div>
        </div>
      </div>

      <div class="sidebar-content" id="sidebarContent">
        <!-- Sections will be injected here -->

        <!-- Section: Active Theme -->
        <div class="accordion-item" id="activeThemeSection">
          <div class="accordion-header" onclick="toggleAccordion(this)">
            Active Theme
          </div>
          <div class="accordion-body">
            <div style="display: flex; gap: 12px; margin-bottom: 12px">
              <div
                id="themeThumb"
                style="
                  width: 80px;
                  height: 50px;
                  background: #eee;
                  border-radius: 4px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 20px;
                "
              >
                🎨
              </div>
              <div>
                <div id="themeName" style="font-weight: 600; font-size: 14px">
                  Unknown
                </div>
                <button
                  onclick="window.location.href = '/dashboard/theme'"
                  style="
                    border: 1px solid #d1d5db;
                    background: white;
                    padding: 4px 8px;
                    border-radius: 4px;
                    font-size: 11px;
                    cursor: pointer;
                    margin-top: 4px;
                  "
                >
                  Change
                </button>
              </div>
            </div>
            <p style="font-size: 12px; color: #6b7280" id="themeDesc"></p>
          </div>
        </div>

        <!-- Section: Site Identity -->
        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">
            Site Identity
          </div>
          <div class="accordion-body">
            <div class="form-group" style="margin-bottom: 12px">
              <label
                style="
                  font-size: 12px;
                  font-weight: 500;
                  display: block;
                  margin-bottom: 4px;
                "
                >Favicon</label
              >
              <div style="display: flex; gap: 10px; align-items: center">
                <div
                  id="editorFaviconPreview"
                  style="
                    width: 32px;
                    height: 32px;
                    border: 1px solid #ddd;
                    border-radius: 4px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    overflow: hidden;
                  "
                >
                  <span style="font-size: 10px">Icon</span>
                </div>
                <button
                  class="btn-secondary"
                  style="font-size: 11px; padding: 4px 8px"
                  onclick="
                    document.getElementById('editorFaviconInput').click()
                  "
                >
                  Upload
                </button>
                <input
                  type="file"
                  id="editorFaviconInput"
                  hidden
                  accept="image/*"
                  onchange="uploadEditorFavicon()"
                />
              </div>
              <p style="font-size: 10px; color: #666; margin-top: 4px">
                ICO/PNG max 100KB
              </p>
            </div>
          </div>
        </div>

        <!-- Dynamic Sections -->
        <div id="configSections"></div>
      </div>

      <div class="sidebar-footer">
        <button class="btn-save" onclick="saveTheme()">Publikasikan</button>

        <div class="device-toggles">
          <span
            style="font-size: 12px; margin-right: auto; color: #9ca3af"
            onclick="toggleSidebar()"
            role="button"
            >Hide Controls</span
          >
          <button
            class="device-btn active"
            onclick="setDevice('desktop')"
            title="Desktop"
          >
            <i data-lucide="monitor" width="16"></i>
          </button>
          <button
            class="device-btn"
            onclick="setDevice('tablet')"
            title="Tablet"
          >
            <i data-lucide="tablet" width="16"></i>
          </button>
          <button
            class="device-btn"
            onclick="setDevice('mobile')"
            title="Mobile"
          >
            <i data-lucide="smartphone" width="16"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Preview -->
    <main class="preview-area">
      <div class="loading-overlay" id="loadingOverlay">
        <div
          style="
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
          "
        ></div>
      </div>
      <div class="preview-container" id="previewContainer">
        <iframe id="previewFrame" title="Site Preview"></iframe>
      </div>
    </main>

    <script>
      // State
      let storeId = null;
      let currentStore = {};
      let activeTheme = null;
      let currentConfig = {};
      let storeProducts = [];
      let storeCategories = [];

      // Init
      lucide.createIcons();

      // Auth Helper
      function getAuthToken() {
        return localStorage.getItem("sello_token");
      }

      async function apiRequest(endpoint, options = {}) {
        const token = getAuthToken();
        if (!token) {
          window.location.href = "/login";
          return null;
        }

        const headers = {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
          ...(options.headers || {}),
        };

        const res = await fetch(endpoint, { ...options, headers });

        if (res.status === 401) {
          window.location.href = "/login";
          return null;
        }

        return res.json();
      }

      // Check auth & load data
      async function init() {
        try {
          // 1. Get User to verify auth
          const userRes = await apiRequest("/api/auth/me");
          if (!userRes) return;

          // 2. Get Stores
          const stores = await apiRequest("/api/stores");
          if (!stores || !stores.length) {
            alert("Anda belum memiliki toko.");
            return (window.location.href = "/dashboard");
          }

          currentStore = stores[0]; // Use first store for now
          storeId = currentStore.id;

          document.getElementById("storeNameDisplay").textContent =
            currentStore.name;

          // 3. Fetch Real Store Data (Products & Cats)
          await fetchStoreData();

          // 4. Fetch Theme Status
          const res = await apiRequest(`/api/stores/${storeId}/theme`);
          console.log("Theme Status Response:", res);
          activeTheme = res.theme;
          if (res.meta) {
            activeTheme.meta = res.meta;
          }
          currentConfig = res.custom_config || res.default_config || {};

          // MERGE MISSING DEFAULTS (Vital for new schema keys)
          if (activeTheme.meta && activeTheme.meta.settings) {
            activeTheme.meta.settings.forEach((s) => {
              if (s.id && currentConfig[s.id] === undefined) {
                currentConfig[s.id] = s.default;
              }
            });
          }

          // Render Info & Config
          renderThemeInfo();
          renderConfigSections();

          // Load Preview
          loadPreview();
        } catch (err) {
          console.error("Init Error:", err);
          alert("Gagal memuat editor tema.");
        }
      }

      async function fetchStoreData() {
        try {
          const [pRes, cRes] = await Promise.all([
            apiRequest(`/api/stores/${storeId}/products`),
            apiRequest(`/api/stores/${storeId}/categories`),
          ]);
          // Products API returns wrapped {data: []}, Categories returns []
          storeProducts = pRes.data || [];
          storeCategories = cRes || [];

          console.log("Loaded Store Data:", {
            products: storeProducts.length,
            categories: storeCategories.length,
          });
        } catch (e) {
          console.warn("Failed to fetch store data", e);
        }
      }

      function renderThemeInfo() {
        document.getElementById("themeName").textContent = activeTheme.name;
        document.getElementById("themeDesc").textContent =
          activeTheme.description;
        if (activeTheme.thumbnail_url) {
          document.getElementById("themeThumb").innerHTML =
            `<img src="${activeTheme.thumbnail_url}" style="width:100%; height:100%; object-fit:cover; border-radius:4px;" onerror="this.onerror=null; this.parentElement.innerHTML='📸'">`;
        } else {
          document.getElementById("themeThumb").innerHTML =
            `<div style="display:flex; flex-direction:column; align-items:center; color:#888;"><i data-lucide="image"></i></div>`;
          lucide.createIcons();
        }

        const section = document.getElementById("activeThemeSection");
        // Auto expand active theme if needed, or close it
        section.querySelector(".accordion-header").click();
      }

      function renderConfigSections() {
        const container = document.getElementById("configSections");
        container.innerHTML = "";

        if (!activeTheme.meta || !activeTheme.meta.settings) {
          container.innerHTML =
            "<p style='padding:16px; color:#666;'>Theme has no settings schema.</p>";
          return;
        }

        let currentSectionTitle = "General";
        let currentSectionId = "general";
        let currentFields = [];

        // Helper to flush section
        const flushSection = () => {
          if (currentFields.length === 0) return;

          const fieldsHtml = currentFields
            .map((field) => renderField(field))
            .join("");
          container.innerHTML += createSection(
            currentSectionId,
            currentSectionTitle,
            fieldsHtml,
          );
          currentFields = [];
        };

        activeTheme.meta.settings.forEach((setting, index) => {
          // Check Scope
          if (
            setting.scope &&
            setting.scope !== "global" &&
            setting.scope !== currentTemplateName
          ) {
            return;
          }

          if (setting.type === "header") {
            flushSection();
            currentSectionTitle = setting.content || setting.label || "Section";
            currentSectionId = "section-" + index;
          } else {
            currentFields.push(setting);
          }
        });
        flushSection();

        // Refresh Lucide icons in newly rendered content
        lucide.createIcons();
      }

      function createSection(id, title, content) {
        return `
            <div class="accordion-item active">
              <div class="accordion-header" onclick="toggleAccordion(this)">
                ${title}
              </div>
              <div class="accordion-body">
                ${content}
              </div>
            </div>`;
      }

      function renderField(setting) {
        const val =
          currentConfig[setting.id] !== undefined
            ? currentConfig[setting.id]
            : setting.default;

        let inputHtml = "";

        switch (setting.type) {
          case "text":
            // Escape HTML entities for safe display in input
            const escapedVal = String(val)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;");
            inputHtml = `<input type="text" class="input-text" value="${escapedVal}"
                    oninput="updateConfig('${setting.id}', this.value)" data-bind="${setting.id}">`;
            break;
          case "color":
            inputHtml = `
                    <div class="input-color-wrapper">
                       <input type="color" class="input-color" value="${val}"
                          oninput="updateConfig('${setting.id}', this.value)">
                       <span style="font-size:12px; color:#374151;">${val}</span>
                    </div>`;
            break;
          case "image":
            inputHtml = `
                    <div class="image-uploader">
                        ${val ? `<img src="${val}" style="width:100%; height:120px; object-fit:cover; border-radius:4px; margin-bottom:8px;">` : ""}
                        <input type="file" accept="image/*" onchange="handleImageUpload(this, '${setting.id}')" style="font-size:12px;">
                        ${val ? `<button onclick="updateConfig('${setting.id}', '')" style="margin-top:4px; font-size:11px; color:red; background:none; border:none; cursor:pointer;">Remove Image</button>` : ""}
                    </div>`;
            break;
          case "icon":
            inputHtml = renderIconPickerInput(setting, val);
            break;
          case "repeater":
            // Repeater Logic with Accordion
            const items = Array.isArray(val) ? val : [];
            const schema = setting.schema || [];

            const renderedItems = items
              .map((item, idx) => {
                const fieldsHtml = schema
                  .map((field) => {
                    const fieldVal =
                      item[field.id] !== undefined
                        ? item[field.id]
                        : field.default;
                    return renderRepeaterSubField(
                      setting.id,
                      idx,
                      field,
                      fieldVal,
                    );
                  })
                  .join("");

                // Get a display label for the accordion header (use first text field or index)
                const firstTextField = schema.find((f) => f.type === "text");
                const itemLabel =
                  firstTextField && item[firstTextField.id]
                    ? item[firstTextField.id].substring(0, 30) +
                      (item[firstTextField.id].length > 30 ? "..." : "")
                    : `Item ${idx + 1}`;

                return `
                    <div class="repeater-item" style="border:1px solid #e5e7eb; background:#ffffff; border-radius:8px; margin-bottom:8px; overflow:hidden;">
                        <div class="repeater-item-header" onclick="toggleRepeaterItem(this)" style="padding:12px 14px; background:#f9fafb; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e5e7eb;">
                            <span style="font-size:13px; font-weight:500; color:#374151;">${itemLabel}</span>
                            <div style="display:flex; gap:8px; align-items:center;">
                                <button onclick="event.stopPropagation(); removeRepeaterItem('${setting.id}', ${idx})" style="color:#ef4444; border:none; background:none; cursor:pointer; padding:4px;">
                                    <i data-lucide="trash-2" width="14"></i>
                                </button>
                                <i data-lucide="chevron-down" width="16" class="repeater-chevron" style="color:#9ca3af; transition:transform 0.2s;"></i>
                            </div>
                        </div>
                        <div class="repeater-item-body" style="padding:14px; display:none;">
                            ${fieldsHtml}
                        </div>
                    </div>
                `;
              })
              .join("");

            inputHtml = `
                <div class="repeater-wrapper">
                    <div class="repeater-list">
                        ${renderedItems}
                    </div>
                    <button onclick="addRepeaterItem('${setting.id}')" style="width:100%; border:1px dashed #d1d5db; padding:10px; background:white; color:#6b7280; font-size:12px; border-radius:6px; cursor:pointer; margin-top:5px; display:flex; align-items:center; justify-content:center; gap:6px;">
                        <i data-lucide="plus" width="14"></i> Tambah Item
                    </button>
                </div>
            `;
            break;
        }

        return `
            <div class="control-group">
               <label class="control-label" style="display:flex; justify-content:space-between; align-items:center;">
                    ${setting.label || setting.id}
                    ${setting.type === "repeater" ? `<span style="font-size:10px; color:#999; font-weight:normal;">${Array.isArray(val) ? val.length : 0} items</span>` : ""}
               </label>
               ${inputHtml}
            </div>
          `;
      }

      // --- Repeater Helpers ---

      function renderRepeaterSubField(repeaterId, index, field, value) {
        let input = "";
        // Unique ID for the input to avoid conflicts (not strictly necessary for logic but good for labels)
        const uid = `${repeaterId}-${index}-${field.id}`;

        if (field.type === "text") {
          input = `<input type="text" class="input-text" value="${value}"
                  oninput="updateRepeaterItem('${repeaterId}', ${index}, '${field.id}', this.value)">`;
        } else if (field.type === "color") {
          input = `<div class="input-color-wrapper">
                        <input type="color" class="input-color" value="${value}"
                            oninput="updateRepeaterItem('${repeaterId}', ${index}, '${field.id}', this.value)">
                        <span style="font-size:11px; color:#666;">${value}</span>
                       </div>`;
        } else if (field.type === "icon") {
          // Manual render for repeater icon to avoid closure stringification issues in renderIconPickerInput
          input = `
            <div style="display:flex; gap:8px; align-items:center;">
                <div style="width:36px; height:36px; background:#f3f4f6; border-radius:4px; display:flex; align-items:center; justify-content:center; border:1px solid #e5e7eb;">
                    <i class="${value}"></i>
                </div>
                <input type="text" class="input-text" value="${value}"
                    oninput="updateRepeaterItem('${repeaterId}', ${index}, '${field.id}', this.value)"
                    style="flex:1;">
                <button onclick="openIconPicker(this, '${value}')" style="background:#fff; border:1px solid #d1d5db; padding:6px 10px; border-radius:4px; cursor:pointer;" title="Pick Icon">
                    <i class="fas fa-icons"></i>
                </button>
            </div>
            `;
        }

        return `
            <div style="margin-bottom:8px;">
                <label style="font-size:11px; color:#6b7280; display:block; margin-bottom:2px;">${field.label}</label>
                ${input}
            </div>
          `;
      }

      function updateRepeaterItem(repeaterId, index, fieldId, newValue) {
        const currentArr = [...(currentConfig[repeaterId] || [])];
        if (!currentArr[index]) return;

        // Clone item
        currentArr[index] = { ...currentArr[index], [fieldId]: newValue };

        updateConfig(repeaterId, currentArr);
      }

      function addRepeaterItem(repeaterId) {
        const schema =
          activeTheme.meta.settings.find((s) => s.id === repeaterId)?.schema ||
          [];
        const currentArr = [...(currentConfig[repeaterId] || [])];

        const file = input.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("image", file);

        try {
          try {
            // Show loading state
            input.disabled = true;
            const loadingSpan = document.createElement("span");
            loadingSpan.id = "upload-loading-" + key;
            loadingSpan.textContent = " Uploading...";
            loadingSpan.style.color = "#2563eb";
            loadingSpan.style.fontSize = "11px";
            loadingSpan.style.marginLeft = "8px";
            input.parentNode.appendChild(loadingSpan);

            // Re-implementing fetch here to avoid apiRequest adding JSON headers automatically which breaks form-data
            const token = getAuthToken();
            const uploadRes = await fetch(`/api/stores/${storeId}/upload`, {
              method: "POST",
              headers: { Authorization: `Bearer ${token}` },
              body: formData,
            });
            const data = await uploadRes.json();

            if (uploadRes.ok) {
              updateConfig(key, data.url);
              // Rerender to show image preview
              renderConfigSections();
            } else {
              alert("Upload failed: " + (data.error || "Unknown error"));
            }
          } catch (err) {
            console.error(err);
            alert("Upload Error");
          } finally {
            input.disabled = false;
            const loader = document.getElementById("upload-loading-" + key);
            if (loader) loader.remove();
          }
        } catch (e) {
          console.error(e);
          alert("Upload validation failed");
        } finally {
          input.disabled = false;
        }
      }

            if (!openMatch) break;

            const startTagStart = openMatch.index;
            const startTagEnd = startTagStart + openMatch[0].length;

            // Find matching closing tag with nesting logic
            const substring = html.substring(startTagEnd);
            let depth = 1;
            let closingTagStart = 0;
            let closingTagEnd = 0;
            let found = false;
            let currentIndex = 0;

            while (true) {
              // Find next START_IF or END_IF relative to current position
              const subSearch = substring.substring(currentIndex);
              const locNextIf = subSearch.match(reAnyIf);
              const locNextClose = subSearch.match(reClose);

              let nextKey = "";
              let nextIndex = -1;
              let matchLength = 0;

              // Determine which one comes first
              const ifIndex = locNextIf ? locNextIf.index : Infinity;
              const closeIndex = locNextClose ? locNextClose.index : Infinity;

              if (ifIndex === Infinity && closeIndex === Infinity) {
                break; // No more tags
              }

              if (ifIndex < closeIndex) {
                nextKey = "if";
                nextIndex = ifIndex;
                matchLength = locNextIf[0].length;
              } else {
                nextKey = "close";
                nextIndex = closeIndex;
                matchLength = locNextClose[0].length;
              }

              const absStart = currentIndex + nextIndex;
              const absEnd = absStart + matchLength;

              if (nextKey === "if") {
                depth++;
              } else {
                depth--;
              }

              currentIndex = absEnd;

              if (depth === 0) {
                closingTagStart = startTagEnd + absStart;
                closingTagEnd = startTagEnd + absEnd;
                found = true;
                break;
              }
            }

            if (!found) {
              console.warn(`No matching closing tag for IF ${condition}`);
              break;
            }

            // Extract Block Content
            const blockContent = html.substring(startTagEnd, closingTagStart);

            // Handle Else (Top Level Only)
            let elsePos = -1;
            let elseLen = 0;

            depth = 0;
            let curIdx = 0;

            while (true) {
              const subBlock = blockContent.substring(curIdx);
              const locIf = subBlock.match(reAnyIf);
              const locClose = subBlock.match(reClose);
              const locElse = subBlock.match(reElse);

              const idxIf = locIf ? locIf.index : Infinity;
              const idxClose = locClose ? locClose.index : Infinity;
              const idxElse = locElse ? locElse.index : Infinity;

              const minIdx = Math.min(idxIf, idxClose, idxElse);
              if (minIdx === Infinity) break;

              const realStart = curIdx + minIdx;

              if (minIdx === idxIf) {
                depth++;
                curIdx = realStart + locIf[0].length;
              } else if (minIdx === idxClose) {
                depth--;
                curIdx = realStart + locClose[0].length;
              } else if (minIdx === idxElse) {
                if (depth === 0) {
                  elsePos = realStart;
                  elseLen = locElse[0].length;
                  break;
                }
                curIdx = realStart + locElse[0].length;
              }
            }

            let finalContent = "";
            if (elsePos !== -1) {
              const trueBlock = blockContent.substring(0, elsePos);
              const falseBlock = blockContent.substring(elsePos + elseLen);
              finalContent = keepTrue ? trueBlock : falseBlock;
            } else {
              finalContent = keepTrue ? blockContent : "";
            }

            // Reconstruct HTML
            html =
              html.substring(0, startTagStart) +
              finalContent +
              html.substring(closingTagEnd);
          }
          return html;
        }

        // Iterate over flat config
        Object.entries(config || {}).forEach(([key, value]) => {
          // Simple Text Replacement: KEY -> value
          html = html.replace(
            new RegExp("\\x7b\\x7b" + key + "\\x7d\\x7d", "g"),
            value,
          );

          // Handle Conditionals (General)
          // Determine truthiness basically
          const isTruthy = value && value !== "0" && value !== "false";
          html = processConditional(html, key, isTruthy); // Generic: IF key
          html = processConditional(html, "store." + key, isTruthy); // Specific: IF store.key
        });

        // Specific Fixes for Known Conditionals (Store)
        const storeLogoUrl = config["logo_url"] || ""; // assuming config has logo_url from store object flatten?
        // Actually config passed here is usually THEME config. Store data is handled separately?
        // Wait, applyConfigToHtml is called with (html, config).

        // Looking at previous code, verify where store data comes from.
        // Ah, typically store.* is replaced separately or we need to ensure we handle it.
        // In `applyConfigToHtml` we seem to be processing a mix.
        // Let's ensure we process strict store conditionals if they are not in config.
        // But previously we replaced store.logo_url placeholders.

        // Let's assume the previous steps (lines 800+) handled store.name etc.
        // But we need to handle specific conditionals that might have been skipped or need robust processing.

        // We need to re-run processConditional for critical store fields just in case they weren't covered by config loop
        // (e.g. if they are not in the 'config' object passed but in 'currentStore')

        if (typeof currentStore !== "undefined") {
          html = processConditional(
            html,
            "store.logo_url",
            !!currentStore.logo_url,
          );
          html = processConditional(
            html,
            "store.description",
            !!currentStore.description,
          );
        }

        // Mock Product Loop - ROBUST SPECIALIZED IMPLEMENTATION
        // as requested ("format khusus") for "patent" catalog style

        // 1. Find the Loop Block
        const eachProductsRegex = new RegExp(
          "\\x7b\\x7b\\s*#each\\s+products\\s*\\x7d\\x7d([\\s\\S]*?)\\x7b\\x7b\\s*/each\\s*\\x7d\\x7d",
          "i", // Case insensitive
        );
        const itemTemplateMatch = html.match(eachProductsRegex);

        if (itemTemplateMatch) {
          let itemTemplate = itemTemplateMatch[1];
          const matchIndex = itemTemplateMatch.index;
          const matchLength = itemTemplateMatch[0].length;

          // 2. Handle ELSE inside the loop (Split Template)
          // Strategy: Find the LAST ELSE tag because the product loop's ELSE is always at the end
          // just before /EACH tag. Any inner ELSE (like for images) will be before it.
          const elseRegex = new RegExp(
            "\\x7b\\x7b\\s*else\\s*\\x7d\\x7d",
            "gi",
          );
          let lastElseMatch = null;
          let match;
          while ((match = elseRegex.exec(itemTemplate)) !== null) {
            lastElseMatch = match;
          }

          if (lastElseMatch) {
            const splitIdx = lastElseMatch.index;
            // We only want the part BEFORE the LAST ELSE tag
            // This assumes the loop structure is EACH ... ELSE ... /EACH
            itemTemplate = itemTemplate.substring(0, splitIdx);
          }

          let itemsHtml = "";

          // 3. Generate Products using Specialized Logic
          // USE REAL DATA IF AVAILABLE
          const productsToRender =
            storeProducts && storeProducts.length > 0
              ? storeProducts
              : Array.from({ length: 8 }).map((_, i) =>
                  i === 0
                    ? { ...mockProduct, id: "1" }
                    : {
                        ...mockProduct,
                        id: i + 1,
                        name: "Produk " + (i + 1),
                        image_url: i % 2 === 0 ? mockProduct.image_url : "",
                      },
                );

          productsToRender.forEach((prod, i) => {
            let item = itemTemplate;
            // Ensure properties exist and ID is string
            const p = {
              ...prod,
              id: prod.id || i + 1,
              name: prod.name || "Product Name",
              price: prod.price || 0,
              original_price: prod.original_price,
              description: prod.description,
              image_url: prod.image_url,
              discount_percent: prod.discount_percent,
            };

            // SPECIALIZED FORMAT for Image Conditional
            // Instead of generic processConditional, we explicitly handle the Image Block
            // Pattern: IF image_url ... ELSE ... /IF
            // Note: We use [\s\S]*? for content scanning
            const imgBlockRegex = new RegExp(
              "\\x7b\\x7b\\s*#if\\s+this\\.image_url\\s*\\x7d\\x7d([\\s\\S]*?)\\x7b\\x7b\\s*else\\s*\\x7d\\x7d([\\s\\S]*?)\\x7b\\x7b\\s*/if\\s*\\x7d\\x7d",
              "i",
            );
            const imgBlockMatch = item.match(imgBlockRegex);

            if (imgBlockMatch) {
              // If match found, choose explicit block based on p.image_url
              const trueBlock = imgBlockMatch[1];
              const falseBlock = imgBlockMatch[2];
              const contentToKeep = p.image_url ? trueBlock : falseBlock;

              // Replace the ENTIRE block with the chosen content
              item = item.replace(imgBlockRegex, contentToKeep);
            } else {
              // Fallback: Try match without ELSE
              const imgBlockSimpleRegex = new RegExp(
                "\\x7b\\x7b\\s*#if\\s+this\\.image_url\\s*\\x7d\\x7d([\\s\\S]*?)\\x7b\\x7b\\s*/if\\s*\\x7d\\x7d",
                "i",
              );
              const imgSimpleMatch = item.match(imgBlockSimpleRegex);
              if (imgSimpleMatch) {
                const trueBlock = imgSimpleMatch[1];
                const contentToKeep = p.image_url ? trueBlock : "";
                item = item.replace(imgBlockSimpleRegex, contentToKeep);
              }
            }

            // Replace simple placeholders (Standard)
            item = item.replace(
              new RegExp("\\x7b\\x7b\\s*this\\.name\\s*\\x7d\\x7d", "g"),
              p.name,
            );
            const fmtPrice = new Intl.NumberFormat("id-ID").format(p.price);
            item = item.replace(
              new RegExp("\\x7b\\x7b\\s*this\\.price\\s*\\x7d\\x7d", "g"),
              fmtPrice,
            );
            item = item.replace(
              new RegExp("\\x7b\\x7b\\s*this\\.id\\s*\\x7d\\x7d", "g"),
              p.id,
            );
            item = item.replace(
              new RegExp("\\x7b\\x7b\\s*this\\.description\\s*\\x7d\\x7d", "g"),
              p.description || "",
            );
            // Replace standalone image_url if invalid placeholder remains (e.g. in src tag if logic above failed or inside tag)
            item = item.replace(
              new RegExp("\\x7b\\x7b\\s*this\\.image_url\\s*\\x7d\\x7d", "g"),
              p.image_url || "",
            );

            // Process other conditionals generically
            item = processConditional(
              item,
              "this.original_price",
              !!p.original_price,
            );
            item = processConditional(
              item,
              "this.discount_percent",
              !!p.discount_percent,
            );

            itemsHtml += item;
          });

          // 4. Forceful Replacement using Substring (Avoid Replace() pitfalls)
          html =
            html.substring(0, matchIndex) +
            itemsHtml +
            html.substring(matchIndex + matchLength);

          // Perform the final replacement using the SAME regex
          html = html.replace(eachProductsRegex, itemsHtml);
        }
        // INJECT PREVIEW GUARD SCRIPT
        html += `
          <script>
            document.addEventListener('click', function(e) {
              // Allow buttons/interactions but prevent link navigation
              const anchor = e.target.closest('a');
              if (anchor) {
                 e.preventDefault();
                 console.log("Navigation disabled in preview mode");
              }
            }, true);
          <\/script>
        `;
        return html;
      }
