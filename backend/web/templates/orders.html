<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }} — Sello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
        display: inline-block;
      }
      .badge-pending {
        background: #fee2e2;
        color: #dc2626;
      }
      .badge-waiting_confirmation {
        background: #fef3c7;
        color: #d97706;
      }
      .badge-paid {
        background: #dcfce7;
        color: #16a34a;
      }
      .badge-shipped {
        background: #dbeafe;
        color: #2563eb;
      }
      .badge-completed {
        background: #f3f4f6;
        color: #374151;
      }
      .badge-cancelled {
        background: #f3f4f6;
        color: #9ca3af;
        text-decoration: line-through;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .modal.show {
        display: flex;
        opacity: 1;
        align-items: center;
        justify-content: center;
      }

      .proof-img {
        max-width: 100%;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        margin-top: 8px;
      }
    </style>
  </head>
  <body class="dashboard-page">
    <div id="sidebar"></div>
    <main class="main-content">
      <header class="dashboard-header">
        <div class="header-left">
          <h1>{{ .Title }}</h1>
          <p>Kelola pesanan masuk dan konfirmasi pembayaran</p>
        </div>
      </header>

      <div class="content-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID/Tgl</th>
                <th>Pelanggan</th>
                <th>Total</th>
                <th>Status</th>
                <th>Bukti Bayar</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr>
                <td colspan="6" class="text-center" style="padding: 20px">
                  Memuat data...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Detail Modal -->
    <div id="orderModal" class="modal">
      <div
        class="modal-content"
        style="
          background: white;
          padding: 24px;
          border-radius: 12px;
          max-width: 600px;
          width: 100%;
          max-height: 90vh;
          overflow-y: auto;
          margin: 20px;
        "
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            align-items: center;
          "
        >
          <h2 id="modalTitle" style="margin: 0; font-size: 18px">
            Detail Pesanan
          </h2>
          <button
            onclick="closeModal()"
            style="
              background: none;
              border: none;
              font-size: 24px;
              cursor: pointer;
            "
          >
            &times;
          </button>
        </div>
        <div id="modalBody"></div>
        <div
          style="
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid #eee;
            padding-top: 16px;
          "
        >
          <button
            onclick="updateStatus('paid')"
            class="btn btn-primary"
            id="btnConfirm"
            style="display: none"
          >
            Konfirmasi Lunas
          </button>
          <button
            onclick="updateStatus('shipped')"
            class="btn btn-primary"
            id="btnShip"
            style="display: none"
          >
            Kirim Barang
          </button>
          <button
            onclick="updateStatus('cancelled')"
            class="btn"
            style="background: #fee2e2; color: #dc2626"
          >
            Batalkan
          </button>
        </div>
      </div>
    </div>

    <script src="/static/js/admin-layout.js?v=2"></script>
    <script src="/static/js/orders.js"></script>
  </body>
</html>
