<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toko Ditangguhkan - Sello</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f9fafb;
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }
      .container {
        background: white;
        padding: 48px;
        border-radius: 16px;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        max-width: 480px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        background: #fee2e2;
        color: #ef4444;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #111827;
      }
      p {
        color: #6b7280;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .reason-box {
        background: #f3f4f6;
        padding: 16px;
        border-radius: 8px;
        font-size: 14px;
        color: #4b5563;
        text-align: left;
        border-left: 4px solid #ef4444;
        margin-bottom: 24px;
      }
      .reason-label {
        font-weight: 600;
        display: block;
        margin-bottom: 4px;
        color: #374151;
      }
      .btn {
        display: inline-block;
        background: #2563eb;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #1d4ed8;
      }
      .footer {
        margin-top: 32px;
        font-size: 12px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h1>Toko Tidak Dapat Diakses</h1>
      <p>
        Maaf, toko yang Anda tuju saat ini sedang ditangguhkan dan tidak dapat
        diakses oleh publik.
      </p>

      {{ if .Reason }}
      <div class="reason-box">
        <span class="reason-label">Alasan Penangguhan:</span>
        {{ .Reason }}
      </div>
      {{ end }}

      <a href="https://sello.id" class="btn">Kembali ke Sello</a>

      <div class="footer">&copy; 2024 Sello Platform. All rights reserved.</div>
    </div>
  </body>
</html>
