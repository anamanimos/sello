<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan Orders - Sello Console</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- DataTables CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css"
    />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <link rel="icon" href="/static/images/sello-icon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <style>
      /* Reuse styles from console_stores.html for consistency */
      .dataTables_wrapper .dataTables_length,
      .dataTables_wrapper .dataTables_filter {
        margin-bottom: 20px;
      }
      .dataTables_wrapper .dataTables_length select,
      .dataTables_wrapper .dataTables_filter input {
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 6px 10px;
        font-family: inherit;
        font-size: 14px;
        margin-left: 8px;
        color: var(--text-primary);
      }
      .dataTables_wrapper .dataTables_filter input:focus,
      .dataTables_wrapper .dataTables_length select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
      }
      table.dataTable thead th {
        background-color: #f8fafc;
        border-bottom: 1px solid #e2e8f0 !important;
        color: #64748b;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 16px 24px !important;
      }
      table.dataTable tbody td {
        padding: 16px 24px !important;
        border-bottom: 1px solid #f1f5f9 !important;
        color: #334155;
        font-size: 14px;
        vertical-align: middle;
      }
      table.dataTable.no-footer {
        border-bottom: 1px solid #e2e8f0 !important;
      }

      .badge {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .badge-success {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #bbf7d0;
      }
      .badge-warning {
        background: #fef9c3;
        color: #854d0e;
        border: 1px solid #fde047;
      }
      .badge-info {
        background: #e0f2fe;
        color: #0369a1;
        border: 1px solid #bae6fd;
      }
      .badge-danger {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }

      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
      }

      .wrapper-card {
        background: white;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        padding: 24px;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body class="dashboard-page">
    <div id="sidebar"></div>

    <main class="main-content">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 32px;
        "
      >
        <div>
          <h1
            style="
              font-size: 24px;
              font-weight: 700;
              color: var(--text-primary);
              margin-bottom: 4px;
            "
          >
            Kelola Order & Paket
          </h1>
          <p style="color: var(--text-secondary)">
            Monitor tagihan dan assign paket manual.
          </p>
        </div>
        <div>
          <button
            class="btn btn-primary"
            onclick="openManualOrderModal()"
            style="
              padding: 10px 20px;
              font-weight: 500;
              box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              style="margin-right: 8px; vertical-align: text-bottom"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Buat Order Manual
          </button>
        </div>
      </div>

      <div class="wrapper-card">
        <table id="ordersTable" class="table" style="width: 100%">
          <thead>
            <tr>
              <th>ID Invoice</th>
              <th>Merchant (User)</th>
              <th>Paket</th>
              <th>Total</th>
              <th>Status</th>
              <th>Proof</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <!-- DataTables -->
          </tbody>
        </table>
      </div>
    </main>

    <script src="/static/js/console-layout.js"></script>
    <script>
      const API_BASE = "/console/api";
      const token = localStorage.getItem("admin_token");
      if (!token) window.location.href = "/console/login";

      let allPlans = [];

      $(document).ready(function () {
        loadOrders();
        fetchPlans();
      });

      async function apiRequest(url, options = {}) {
        const res = await fetch(url, {
          ...options,
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");
        return data;
      }

      async function fetchPlans() {
        try {
          allPlans = await apiRequest("/api/plans"); // Public endpoint
        } catch (e) {
          console.error("Failed plans", e);
        }
      }

      async function loadOrders() {
        try {
          const res = await apiRequest(`${API_BASE}/subscriptions?limit=1000`); // Fetch all for datatable client side
          if (!res || !res.data) return;
          renderTable(res.data);
        } catch (e) {
          Swal.fire("Error", "Gagal load orders: " + e.message, "error");
        }
      }

      function renderTable(orders) {
        if ($.fn.DataTable.isDataTable("#ordersTable")) {
          $("#ordersTable").DataTable().destroy();
        }

        const tbody = document.getElementById("ordersBody");
        tbody.innerHTML = orders
          .map((o) => {
            const userName = o.user ? o.user.name : "Unknown";
            const userEmail = o.user ? o.user.email : "-";
            const planName = o.plan ? o.plan.name : "Unknown";
            const duration = o.duration_month + " bln";

            let badgeClass = "badge-info";
            if (o.status === "active") badgeClass = "badge-success";
            if (o.status === "paid") badgeClass = "badge-warning";
            if (o.status === "rejected" || o.status === "expired")
              badgeClass = "badge-danger";

            const proofLink = o.payment_proof
              ? `<a href="${o.payment_proof}" target="_blank" style="color:#3b82f6; text-decoration:underline; font-size:13px;">Lihat Bukti ↗</a>`
              : `<span style="color:#94a3b8; font-size:13px;">-</span>`;

            let actionBtn = "";
            if (o.status === "paid" || o.status === "pending") {
              actionBtn = `<button class="btn-sm btn-primary" style="background:#16a34a;" onclick="approveOrder('${o.id}')">Approve</button>`;
            }

            return `
            <tr>
                <td><span style="font-family:monospace; color:#64748b;">#${o.id.substring(0, 8)}</span><br><span style="font-size:11px; color:#94a3b8;">${new Date(o.created_at).toLocaleDateString()}</span></td>
                <td>
                    <div style="font-weight:600; color:#1e293b;">${userName}</div>
                    <div style="font-size:12px; color:#64748b;">${userEmail}</div>
                </td>
                <td>
                    <div style="font-weight:500;">${planName}</div>
                    <div style="font-size:11px; color:#64748b;">${duration}</div>
                </td>
                <td style="font-weight:600;">Rp ${o.amount.toLocaleString()}</td>
                <td><span class="badge ${badgeClass}">${o.status}</span></td>
                <td>${proofLink}</td>
                <td>${actionBtn}</td>
            </tr>
            `;
          })
          .join("");

        $("#ordersTable").DataTable({
          responsive: true,
          pageLength: 10,
          order: [[0, "desc"]], // Sort by ID/Date desc roughly
          language: { searchPlaceholder: "Cari invoice/email..." },
          dom: '<"d-flex justify-content-between align-items-center mb-4"lf>rt<"d-flex justify-content-between align-items-center mt-4"ip>',
        });
      }

      async function approveOrder(id) {
        const result = await Swal.fire({
          title: "Approve Payment?",
          text: "User plan diupdate aktif.",
          icon: "question",
          showCancelButton: true,
          confirmButtonColor: "#16a34a",
          confirmButtonText: "Ya, Approve",
        });

        if (result.isConfirmed) {
          try {
            await apiRequest(`${API_BASE}/subscriptions/${id}/approve`, {
              method: "PUT",
            });
            Swal.fire("Success", "Subscription approved", "success");
            loadOrders();
          } catch (e) {
            Swal.fire("Error", e.message, "error");
          }
        }
      }

      /* --- Manual Order Modal Logic --- */
      async function openManualOrderModal() {
        // Construct Plan Options
        const planOptions = allPlans
          .map(
            (p) =>
              `<option value="${p.id}">${p.name} - Rp ${p.price_monthly.toLocaleString()}/bln</option>`,
          )
          .join("");

        const { value: formValues } = await Swal.fire({
          title: "Buat Order Manual",
          html: `
                <div style="text-align:left; font-size:14px; color:#334155;">
                    <label style="display:block; margin-bottom:4px; font-weight:500;">Email User</label>
                    <input id="swal-email" class="swal2-input" placeholder="user@example.com" style="margin:0 0 16px 0; width:100%;">
                    
                    <label style="display:block; margin-bottom:4px; font-weight:500;">Pilih Paket</label>
                    <select id="swal-plan" class="swal2-select" style="margin:0 0 16px 0; width:100%; display:block;">${planOptions}</select>
                    
                    <label style="display:block; margin-bottom:4px; font-weight:500;">Durasi (Bulan)</label>
                    <input id="swal-duration" type="number" value="1" min="1" class="swal2-input" style="margin:0 0 16px 0; width:100%;">

                    <label style="display:block; margin-bottom:4px; font-weight:500;">Status</label>
                    <select id="swal-status" class="swal2-select" style="margin:0 0 16px 0; width:100%; display:block;">
                        <option value="active">Active (Langsung Aktifkan)</option>
                        <option value="pending">Pending (Menunggu Bayar)</option>
                        <option value="paid">Paid (Sudah Bayar, Butuh Approve)</option>
                    </select>

                    <label style="display:block; margin-bottom:4px; font-weight:500;">Override Harga (Opsional)</label>
                    <input id="swal-amount" type="number" placeholder="Kosongkan utk harga normal" class="swal2-input" style="margin:0; width:100%;">
                </div>
              `,
          focusConfirm: false,
          showCancelButton: true,
          confirmButtonText: "Buat Order",
          preConfirm: () => {
            const email = document.getElementById("swal-email").value;
            if (!email) Swal.showValidationMessage("Email required");
            return {
              email: email,
              plan_id: parseInt(document.getElementById("swal-plan").value),
              duration: parseInt(
                document.getElementById("swal-duration").value,
              ),
              status: document.getElementById("swal-status").value,
              amount:
                parseFloat(document.getElementById("swal-amount").value) || 0,
            };
          },
        });

        if (formValues) {
          try {
            await apiRequest(`${API_BASE}/subscriptions/manual`, {
              method: "POST",
              body: JSON.stringify(formValues),
            });
            Swal.fire("Berhasil", "Manual order dibuat", "success");
            loadOrders();
          } catch (e) {
            Swal.fire("Gagal", e.message, "error");
          }
        }
      }
    </script>
  </body>
</html>
