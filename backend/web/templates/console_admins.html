<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Admin — Sello Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- DataTables CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css"
    />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <link rel="icon" href="/static/images/sello-icon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <style>
      /* DataTables Customization matching Plans page */
      .dataTables_wrapper .dataTables_length,
      .dataTables_wrapper .dataTables_filter {
        margin-bottom: 20px;
      }
      .dataTables_wrapper .dataTables_length select,
      .dataTables_wrapper .dataTables_filter input {
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 6px 10px;
        font-family: inherit;
        font-size: 14px;
        margin-left: 8px;
        color: var(--text-primary);
      }
      .dataTables_wrapper .dataTables_filter input:focus,
      .dataTables_wrapper .dataTables_length select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
      }
      table.dataTable thead th {
        background-color: #f8fafc;
        border-bottom: 1px solid #e2e8f0 !important;
        color: #64748b;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 16px 24px !important;
      }
      table.dataTable tbody td {
        padding: 16px 24px !important;
        border-bottom: 1px solid #f1f5f9 !important;
        color: #334155;
        font-size: 14px;
        vertical-align: middle;
      }
      table.dataTable.no-footer {
        border-bottom: 1px solid #e2e8f0 !important;
      }

      /* Badges */
      .badge {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: capitalize;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .badge.super_admin {
        background: #f3e8ff;
        color: #9333ea;
        border: 1px solid #e9d5ff;
      }
      .badge.admin {
        background: #eff6ff;
        color: #3b82f6;
        border: 1px solid #dbeafe;
      }
      .badge.moderator {
        background: #fef9c3;
        color: #ca8a04;
        border: 1px solid #fde047;
      }
      .badge.sales {
        background: #f0fdf4;
        color: #16a34a;
        border: 1px solid #bbf7d0;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        display: inline-block;
      }
      .status-active {
        background-color: #22c55e;
        box-shadow: 0 0 0 2px #dcfce7;
      }
      .status-inactive {
        background-color: #ef4444;
        box-shadow: 0 0 0 2px #fee2e2;
      }

      /* Buttons */
      .btn-icon {
        padding: 8px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
      }
      .btn-icon svg {
        width: 16px;
        height: 16px;
        stroke-width: 2;
      }
      .btn-edit {
        color: #475569;
        border-color: #e2e8f0;
      }
      .btn-edit:hover {
        background: #f8fafc;
        color: #3b82f6;
        border-color: #cbd5e1;
      }
      .btn-toggle {
        color: #475569;
        border-color: #e2e8f0;
      }
      .btn-toggle:hover {
        background: #fffbeb;
        color: #d97706;
        border-color: #fde68a;
      }
      .btn-delete {
        color: #dc2626;
        background: #fef2f2;
        border-color: #fee2e2;
      }
      .btn-delete:hover {
        background: #fee2e2;
        border-color: #fecaca;
      }

      .wrapper-card {
        background: white;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        padding: 24px;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body class="dashboard-page">
    <div id="sidebar"></div>

    <main class="main-content">
      <div
        class="header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 32px;
        "
      >
        <div>
          <h1
            style="
              font-size: 24px;
              font-weight: 700;
              color: var(--text-primary);
              margin-bottom: 4px;
            "
          >
            Kelola Admin
          </h1>
          <p style="color: var(--text-secondary)">
            Manajemen akses dan role administrator sistem.
          </p>
        </div>
        <button
          class="btn btn-primary"
          onclick="showAddModal()"
          style="
            padding: 10px 20px;
            font-weight: 500;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
          "
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            style="margin-right: 8px; vertical-align: text-bottom"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Tambah Admin
        </button>
      </div>

      <div class="wrapper-card">
        <table id="adminsTable" class="table" style="width: 100%">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Tanggal Dibuat</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="adminsBody">
            <!-- DataTables populates this -->
          </tbody>
        </table>
      </div>
    </main>

    <script src="/static/js/console-layout.js"></script>
    <script>
      const API_BASE = "/console/api";
      const token = localStorage.getItem("admin_token");
      if (!token) window.location.href = "/console/login";

      let currentAdminId = null;

      async function apiRequest(url, options = {}) {
        const res = await fetch(url, {
          ...options,
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");
        return data;
      }

      // Get current admin ID
      async function getCurrentAdmin() {
        try {
          const admin = await apiRequest(`${API_BASE}/auth/me`);
          currentAdminId = admin.id;
        } catch (e) {
          console.error("Failed to get current admin:", e);
        }
      }

      $(document).ready(function () {
        getCurrentAdmin().then(() => loadAdmins());
      });

      async function loadAdmins() {
        try {
          const res = await apiRequest(`${API_BASE}/admins`);
          if (!res || !res.data) {
            Swal.fire("Info", "Data tidak ditemukan", "info");
            return;
          }
          renderTable(res.data);
        } catch (e) {
          Swal.fire("Error", "Gagal memuat data: " + e.message, "error");
        }
      }

      function renderTable(admins) {
        if ($.fn.DataTable.isDataTable("#adminsTable")) {
          $("#adminsTable").DataTable().destroy();
        }

        const tbody = document.getElementById("adminsBody");
        tbody.innerHTML = admins
          .map(
            (a) => `
            <tr>
                <td>
                  <div style="font-weight: 600; color: #1e293b;">${a.name}</div>
                </td>
                <td>
                   <div style="color: #475569;">${a.email}</div>
                </td>
                <td>
                    <span class="badge ${a.role}">
                      ${getRoleIcon(a.role)}
                      ${formatRole(a.role)}
                    </span>
                </td>
                <td>
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <span class="status-dot ${a.is_active ? "status-active" : "status-inactive"}"></span>
                      <span style="font-size: 13px; color: ${a.is_active ? "#15803d" : "#991b1b"}; font-weight: 500;">
                        ${a.is_active ? "Aktif" : "Nonaktif"}
                      </span>
                    </div>
                </td>
                <td>
                  <div style="font-size: 13px; color: #64748b;">
                    ${formatDate(a.created_at)}
                  </div>
                </td>
                <td>
                    ${renderActions(a)}
                </td>
            </tr>
        `,
          )
          .join("");

        // Initialize DataTable
        $("#adminsTable").DataTable({
          responsive: true,
          pageLength: 10,
          lengthMenu: [5, 10, 25, 50],
          language: {
            search: "_INPUT_",
            searchPlaceholder: "Cari admin...",
            lengthMenu: "Tampil _MENU_",
            info: "Menampilkan _START_-_END_ dari _TOTAL_",
            paginate: {
              first: "«",
              last: "»",
              next: "›",
              previous: "‹",
            },
            emptyTable: "Belum ada data admin",
          },
          columnDefs: [{ orderable: false, targets: 5 }],
          dom: '<"d-flex justify-content-between align-items-center mb-4"lf>rt<"d-flex justify-content-between align-items-center mt-4"ip>',
        });
      }

      function getRoleIcon(role) {
        if (role === "super_admin") return "⚡";
        if (role === "admin") return "🛡️";
        if (role === "moderator") return "👁️";
        return "💼";
      }

      function formatRole(role) {
        const roles = {
          super_admin: "Super Admin",
          admin: "Admin",
          moderator: "Moderator",
          sales: "Sales",
        };
        return roles[role] || role;
      }

      function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString("id-ID", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function renderActions(admin) {
        const isSelf = admin.id === currentAdminId;

        if (isSelf) {
          return '<span style="color: #94a3b8; font-size: 12px; font-style: italic;">Akun Anda</span>';
        }

        return `
          <div style="display: flex; gap: 6px;">
            <button class="btn-icon btn-edit" onclick="showEditModal('${admin.id}', '${admin.name}', '${admin.email}', '${admin.role}', ${admin.is_active})" title="Edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="btn-icon btn-toggle" onclick="toggleStatus('${admin.id}', ${admin.is_active})" title="${admin.is_active ? "Nonaktifkan" : "Aktifkan"}">
              ${
                admin.is_active
                  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>' // X icon for deactivate
                  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>' // Check icon for activate
              }
            </button>
            <button class="btn-icon btn-delete" onclick="deleteAdmin('${admin.id}', '${admin.name}')" title="Hapus">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </div>
        `;
      }

      // Add Admin Modal
      async function showAddModal() {
        const { value: formValues } = await Swal.fire({
          title: "Tambah Admin Baru",
          html: `
            <div style="text-align: left;">
              <div style="margin-bottom: 16px;">
                 <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #1f2937;">Nama Lengkap</label>
                 <input id="swal-name" class="swal2-input" placeholder="Masukkan nama" style="margin: 0; width: 100%; border-radius: 6px; border: 1px solid #d1d5db;">
              </div>
              <div style="margin-bottom: 16px;">
                 <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #1f2937;">Email</label>
                 <input id="swal-email" type="email" class="swal2-input" placeholder="email@example.com" style="margin: 0; width: 100%; border-radius: 6px; border: 1px solid #d1d5db;">
              </div>
              <div style="margin-bottom: 16px;">
                 <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #1f2937;">Password</label>
                 <input id="swal-password" type="password" class="swal2-input" placeholder="Minimal 6 karakter" style="margin: 0; width: 100%; border-radius: 6px; border: 1px solid #d1d5db;">
              </div>
              <div style="margin-bottom: 0;">
                 <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #1f2937;">Role</label>
                 <select id="swal-role" class="swal2-select" style="margin: 0; width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; display: block;">
                   <option value="admin">Admin</option>
                   <option value="moderator">Moderator</option>
                   <option value="sales">Sales</option>
                 </select>
              </div>
            </div>
          `,
          focusConfirm: false,
          showCancelButton: true,
          confirmButtonText: "Simpan Admin",
          cancelButtonText: "Batal",
          confirmButtonColor: "#22c55e",
          width: "500px",
          preConfirm: () => {
            const name = document.getElementById("swal-name").value;
            const email = document.getElementById("swal-email").value;
            const password = document.getElementById("swal-password").value;
            const role = document.getElementById("swal-role").value;

            if (!name || !email || !password) {
              Swal.showValidationMessage("Semua field wajib diisi!");
              return false;
            }
            if (password.length < 6) {
              Swal.showValidationMessage("Password minimal 6 karakter!");
              return false;
            }
            return { name, email, password, role };
          },
        });

        if (formValues) {
          try {
            Swal.fire({
              title: "Menyimpan...",
              allowOutsideClick: false,
              didOpen: () => Swal.showLoading(),
            });
            await apiRequest(`${API_BASE}/admins`, {
              method: "POST",
              body: JSON.stringify(formValues),
            });
            Swal.fire({
              icon: "success",
              title: "Berhasil!",
              text: "Admin baru berhasil ditambahkan.",
              timer: 1500,
              showConfirmButton: false,
            });
            loadAdmins();
          } catch (e) {
            Swal.fire({ icon: "error", title: "Gagal", text: e.message });
          }
        }
      }

      // Edit Admin Modal
      async function showEditModal(id, name, email, role, isActive) {
        const { value: formValues } = await Swal.fire({
          title: "Edit Admin",
          html: `
            <div style="text-align: left;">
              <div style="margin-bottom: 16px;">
                 <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #1f2937;">Nama Lengkap</label>
                 <input id="swal-name" class="swal2-input" value="${name}" style="margin: 0; width: 100%; border-radius: 6px; border: 1px solid #d1d5db;">
              </div>
              <div style="margin-bottom: 16px;">
                 <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #1f2937;">Email</label>
                 <input id="swal-email" type="email" class="swal2-input" value="${email}" style="margin: 0; width: 100%; border-radius: 6px; border: 1px solid #d1d5db;">
              </div>
              <div style="margin-bottom: 16px;">
                 <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #1f2937;">Password Baru (Opsional)</label>
                 <input id="swal-password" type="password" class="swal2-input" placeholder="••••••••" style="margin: 0; width: 100%; border-radius: 6px; border: 1px solid #d1d5db;">
                 <small style="color: #6b7280;">Kosongkan jika tidak ingin mengubah password</small>
              </div>
              <div style="margin-bottom: 0;">
                 <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #1f2937;">Role</label>
                 <select id="swal-role" class="swal2-select" style="margin: 0; width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; display: block;">
                   <option value="admin" ${role === "admin" ? "selected" : ""}>Admin</option>
                   <option value="moderator" ${role === "moderator" ? "selected" : ""}>Moderator</option>
                   <option value="sales" ${role === "sales" ? "selected" : ""}>Sales</option>
                 </select>
              </div>
            </div>
          `,
          focusConfirm: false,
          showCancelButton: true,
          confirmButtonText: "Simpan Perubahan",
          cancelButtonText: "Batal",
          confirmButtonColor: "#3b82f6",
          width: "500px",
          preConfirm: () => {
            const data = {
              name: document.getElementById("swal-name").value,
              email: document.getElementById("swal-email").value,
              role: document.getElementById("swal-role").value,
            };
            const password = document.getElementById("swal-password").value;
            if (password) {
              if (password.length < 6) {
                Swal.showValidationMessage("Password minimal 6 karakter!");
                return false;
              }
              data.password = password;
            }
            return data;
          },
        });

        if (formValues) {
          try {
            Swal.fire({
              title: "Menyimpan...",
              allowOutsideClick: false,
              didOpen: () => Swal.showLoading(),
            });
            await apiRequest(`${API_BASE}/admins/${id}`, {
              method: "PUT",
              body: JSON.stringify(formValues),
            });
            Swal.fire({
              icon: "success",
              title: "Berhasil!",
              text: "Data admin berhasil diperbarui.",
              timer: 1500,
              showConfirmButton: false,
            });
            loadAdmins();
          } catch (e) {
            Swal.fire({ icon: "error", title: "Gagal", text: e.message });
          }
        }
      }

      // Toggle Status
      async function toggleStatus(id, currentStatus) {
        const action = currentStatus ? "menonaktifkan" : "mengaktifkan";
        const result = await Swal.fire({
          title: `Konfirmasi`,
          text: `Yakin ingin ${action} akses admin ini?`,
          icon: "question",
          showCancelButton: true,
          confirmButtonText: currentStatus ? "Ya, Nonaktifkan" : "Ya, Aktifkan",
          cancelButtonText: "Batal",
          confirmButtonColor: currentStatus ? "#f59e0b" : "#22c55e",
        });

        if (result.isConfirmed) {
          try {
            Swal.fire({
              title: "Memproses...",
              allowOutsideClick: false,
              didOpen: () => Swal.showLoading(),
            });
            await apiRequest(`${API_BASE}/admins/${id}`, {
              method: "PUT",
              body: JSON.stringify({ is_active: !currentStatus }),
            });
            Swal.fire({
              icon: "success",
              title: "Berhasil!",
              timer: 1500,
              showConfirmButton: false,
            });
            loadAdmins();
          } catch (e) {
            Swal.fire({ icon: "error", title: "Gagal", text: e.message });
          }
        }
      }

      // Delete Admin
      async function deleteAdmin(id, name) {
        const result = await Swal.fire({
          title: "Hapus Admin?",
          text: `Akun "${name}" akan dihapus permanen dari sistem.`,
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Ya, Hapus!",
          cancelButtonText: "Batal",
          confirmButtonColor: "#dc2626",
          cancelButtonColor: "#6b7280",
        });

        if (result.isConfirmed) {
          try {
            Swal.fire({
              title: "Menghapus...",
              allowOutsideClick: false,
              didOpen: () => Swal.showLoading(),
            });
            await apiRequest(`${API_BASE}/admins/${id}`, { method: "DELETE" });
            Swal.fire({
              icon: "success",
              title: "Terhapus!",
              text: "Admin berhasil dihapus.",
              timer: 1500,
              showConfirmButton: false,
            });
            loadAdmins();
          } catch (e) {
            Swal.fire({ icon: "error", title: "Gagal", text: e.message });
          }
        }
      }
    </script>
  </body>
</html>
