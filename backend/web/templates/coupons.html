<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }} — Sello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .modal.show {
        display: flex;
        opacity: 1;
        align-items: center;
        justify-content: center;
      }
      .form-group {
        margin-bottom: 12px;
      }
      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 4px;
        color: #4b5563;
      }
      .form-control {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
      }
      .btn-create {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body class="dashboard-page">
    <div id="sidebar"></div>
    <main class="main-content">
      <header class="dashboard-header">
        <div class="header-left">
          <h1>{{ .Title }}</h1>
          <p>Kelola kode diskon toko Anda</p>
        </div>
        <div class="header-right">
          <button
            onclick="openCreateModal()"
            class="btn btn-primary btn-create"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Buat Kupon
          </button>
        </div>
      </header>

      <div class="content-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Kode</th>
                <th>Diskon</th>
                <th>Min. Belanja</th>
                <th>Batas Pakai</th>
                <th>Berlaku Hingga</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="couponsTableBody">
              <tr>
                <td colspan="6" class="text-center" style="padding: 20px">
                  Memuat data...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Create Modal -->
    <div id="createModal" class="modal">
      <div
        class="modal-content"
        style="
          background: white;
          padding: 24px;
          border-radius: 12px;
          max-width: 500px;
          width: 100%;
          margin: 20px;
        "
      >
        <h2 style="margin-top: 0; margin-bottom: 20px; font-size: 18px">
          Buat Kupon Baru
        </h2>
        <form id="couponForm" onsubmit="handleCreate(event)">
          <div class="form-group">
            <label class="form-label">Kode Kupon</label>
            <input
              type="text"
              name="code"
              class="form-control"
              placeholder="CONTOH: HEMAT10"
              required
              style="text-transform: uppercase"
            />
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
            <div class="form-group">
              <label class="form-label">Tipe Diskon</label>
              <select
                name="type"
                class="form-control"
                onchange="toggleMaxDiscount(this.value)"
              >
                <option value="fixed">Nominal (Rp)</option>
                <option value="percentage">Persentase (%)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Nilai Diskon</label>
              <input
                type="number"
                name="value"
                class="form-control"
                required
                placeholder="Contoh: 10000"
              />
            </div>
          </div>

          <div class="form-group" id="maxDiscountGroup" style="display: none">
            <label class="form-label">Maksimal Diskon (Rp)</label>
            <input
              type="number"
              name="max_discount"
              class="form-control"
              placeholder="0 = Tidak ada batas"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Minimal Belanja (Rp)</label>
            <input
              type="number"
              name="min_purchase"
              class="form-control"
              value="0"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Batas Pemakaian (Jumlah)</label>
            <input
              type="number"
              name="usage_limit"
              class="form-control"
              value="0"
              placeholder="0 = Unlimited"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Berlaku Hingga</label>
            <input type="date" name="expires_at" class="form-control" />
          </div>

          <div
            style="
              display: flex;
              justify-content: flex-end;
              gap: 12px;
              margin-top: 24px;
            "
          >
            <button
              type="button"
              onclick="closeCreateModal()"
              class="btn"
              style="background: #f3f4f6"
            >
              Batal
            </button>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/static/js/admin-layout.js?v=2"></script>
    <script src="/static/js/coupons.js"></script>
  </body>
</html>
