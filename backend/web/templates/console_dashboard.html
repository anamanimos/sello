<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Sello Console</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <link rel="icon" href="/static/images/sello-icon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      .table {
        width: 100%;
        border-collapse: collapse;
      }
      .table th {
        background: #f8fafc;
        padding: 12px 24px;
        text-align: left;
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        border-bottom: 1px solid #e2e8f0;
      }
      .table td {
        padding: 16px 24px;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: middle;
      }
      .badge {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        display: inline-flex;
      }
      .badge-success {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #bbf7d0;
      }
      .badge-danger {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }
    </style>
  </head>
  <body class="dashboard-page">
    <div id="sidebar"></div>

    <main class="main-content">
      <div
        class="header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 32px;
        "
      >
        <h1
          style="font-size: 24px; font-weight: 700; color: var(--text-primary)"
        >
          Dashboard
        </h1>
        <button
          class="btn btn-outline"
          style="
            background: white;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
          "
          onclick="consoleLayout.logout()"
        >
          Logout
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </div>
          </div>
          <div class="stat-value" id="totalUsers">-</div>
          <div class="stat-label">Total Users</div>
        </div>

        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </div>
          </div>
          <div class="stat-value" id="totalStores">-</div>
          <div class="stat-label">Total Stores</div>
        </div>

        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
                ></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
              </svg>
            </div>
          </div>
          <div class="stat-value" id="totalProducts">-</div>
          <div class="stat-label">Total Products</div>
        </div>

        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </div>
          </div>
          <div class="stat-value" id="totalVisits">-</div>
          <div class="stat-label">Total Visits</div>
        </div>
      </div>

      <div
        class="panel"
        style="
          background: white;
          border-radius: 12px;
          border: 1px solid var(--border-color);
          overflow: hidden;
        "
      >
        <div
          class="panel-header"
          style="
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <h3
            style="
              font-size: 16px;
              font-weight: 600;
              color: var(--text-primary);
            "
          >
            Recent Stores
          </h3>
          <a
            href="/console/stores"
            class="btn btn-outline"
            style="font-size: 13px; padding: 6px 12px"
            >View All</a
          >
        </div>
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Store Name</th>
                <th>URL</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recentStores">
              <tr>
                <td
                  colspan="4"
                  class="text-center"
                  style="padding: 24px; color: #94a3b8"
                >
                  Loading...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="/static/js/console-layout.js"></script>
    <script>
      const API_BASE = "/console/api";
      const token = localStorage.getItem("admin_token");
      if (!token) window.location.href = "/console/login";

      async function apiRequest(endpoint) {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
        });
        if (res.status === 401) {
          localStorage.removeItem("admin_token");
          window.location.href = "/console/login";
        }
        return res.json();
      }

      async function loadDashboard() {
        try {
          const stats = await apiRequest("/analytics/overview");
          if (stats) {
            document.getElementById("totalUsers").textContent = stats.users;
            document.getElementById("totalStores").textContent = stats.stores;
            document.getElementById("totalProducts").textContent =
              stats.products;
            document.getElementById("totalVisits").textContent = stats.visits;
          }

          const storesRes = await apiRequest("/stores?limit=5");
          if (storesRes && storesRes.data) {
            const tbody = document.getElementById("recentStores");
            if (storesRes.data.length === 0) {
              tbody.innerHTML = `<tr><td colspan="4" class="text-center" style="padding:24px; color:#94a3b8;">No stores found.</td></tr>`;
              return;
            }
            tbody.innerHTML = storesRes.data
              .map(
                (s) => `
              <tr>
                <td>
                    <div style="font-weight:600; color:#1e293b;">${s.name}</div>
                </td>
                <td>
                    <a href="http://${s.slug}.sello.id" target="_blank" style="color:#3b82f6; text-decoration:none; font-size:13px;">${s.slug}.sello.id ↗</a>
                </td>
                <td>
                  <span class="badge ${s.is_suspended ? "badge-danger" : "badge-success"}">
                    ${s.is_suspended ? "SUSPENDED" : "ACTIVE"}
                  </span>
                </td>
                <td style="color:#64748b; font-size:13px;">
                    ${new Date(s.created_at).toLocaleDateString()}
                </td>
              </tr>
            `,
              )
              .join("");
          }
        } catch (error) {
          console.error("Failed to load dashboard:", error);
        }
      }

      loadDashboard();
    </script>
  </body>
</html>
